name: Cisco RPG Server

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Forge 1.19.2
        run: |
          wget -q https://maven.minecraftforge.net/net/minecraftforge/forge/1.19.2-43.3.0/forge-1.19.2-43.3.0-installer.jar
          java -jar forge-1.19.2-43.3.0-installer.jar --installServer
          echo "eula=true" > eula.txt

      - name: Setup server.properties
        run: |
          cat > server.properties << 'EOF'
          online-mode=false
          server-port=25565
          difficulty=normal
          gamemode=survival
          max-players=10
          EOF

      - name: Start Server
        run: |
          java -Xmx14G -Xms4G \
          @libraries/net/minecraftforge/forge/1.19.2-43.3.0/unix_args.txt \
          nogui
