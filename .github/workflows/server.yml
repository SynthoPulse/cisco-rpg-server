name: Cisco RPG Server
on:
  workflow_dispatch:
jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Check Specs
        run: |
          echo "=== RAM ===" && free -h
          echo "=== CPU Cores ===" && nproc
          echo "=== Storage ===" && df -h

      - name: Install Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Forge 1.19.2-43.3.14
        run: |
          wget -q https://maven.minecraftforge.net/net/minecraftforge/forge/1.19.2-43.3.14/forge-1.19.2-43.3.14-installer.jar
          java -jar forge-1.19.2-43.3.14-installer.jar --installServer
          echo "eula=true" > eula.txt

      - name: Copy modpack files
        run: |
          cp -r mods/ . 2>/dev/null || true
          cp -r config/ . 2>/dev/null || true
          cp -r kubejs/ . 2>/dev/null || true

      - name: Setup server.properties
        run: |
          cat > server.properties << 'EOF'
          online-mode=false
          server-port=25565
          difficulty=normal
          gamemode=survival
          max-players=10
          view-distance=6
          simulation-distance=4
          EOF

      - name: Install playit
        run: |
          curl -SsL https://playit-cloud.github.io/ppa/key.gpg | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/playit.gpg >/dev/null
          echo "deb [signed-by=/etc/apt/trusted.gpg.d/playit.gpg] https://playit-cloud.github.io/ppa/data ./" | sudo tee /etc/apt/sources.list.d/playit-cloud.list
          sudo apt update -qq && sudo apt install -y playit

      - name: Configure playit
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          mkdir -p ~/.config/playit
          echo "$PLAYIT_SECRET" > ~/.config/playit/playit.toml

      - name: Start playit tunnel
        run: |
          playit &
          sleep 20

      - name: Start Minecraft Server
        timeout-minutes: 350
        run: |
          java -Xmx14G -Xms4G \
          -XX:+UseG1GC \
          -XX:+ParallelRefProcEnabled \
          -XX:MaxGCPauseMillis=200 \
          -XX:+UnlockExperimentalVMOptions \
          -XX:G1NewSizePercent=20 \
          -XX:G1ReservePercent=20 \
          -XX:G1HeapRegionSize=32M \
          -XX:G1MixedGCCountTarget=4 \
          -XX:InitiatingHeapOccupancyPercent=15 \
          -Dlog4j2.formatMsgNoLookups=true \
          @libraries/net/minecraftforge/forge/1.19.2-43.3.14/unix_args.txt nogui

      - name: Save world
        if: always()
        env:
          FINE_GRAINED_PAT: ${{ secrets.FINE_GRAINED_PAT }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${FINE_GRAINED_PAT}@github.com/${{ github.repository }}
          git add -A
          git commit -m "Auto-save world" || echo "Nothing to save"
          git push || echo "Push failed"
